<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <!-- Medical Cyan/Blue Glow -->
    <radialGradient id="g1" cx="20%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <!-- Medical Teal/Mint Glow -->
    <radialGradient id="g2" cx="80%" cy="-10%" r="60%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <!-- ECG Crimson Heartbeat Glow (Very Subtle) -->
    <radialGradient id="g3" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#ff4e50" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ff4e50" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1200" fill="#060814"/>
  <circle cx="300" cy="100" r="800" fill="url(#g1)"/>
  <circle cx="1300" cy="0" r="800" fill="url(#g2)"/>
  <circle cx="800" cy="950" r="900" fill="url(#g3)"/>
</svg>
