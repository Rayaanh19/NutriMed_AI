version: "3.8"
services:
  api:
    build: ./backend
    container_name: nutrition-api
    restart: unless-stopped
    environment:
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-3.5-flash
      - NODE_ENV=production
    ports:
      - "5000:5000"

  web:
    build: ./frontend
    container_name: nutrition-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"
